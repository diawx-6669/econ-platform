<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Index — кабинет</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css" />
<link rel="stylesheet" href="assets/css/dashboard.css" />
</head>
<body>

  <div class="aurora-bg" aria-hidden="true">
    <span class="blob blob-violet"></span>
    <span class="blob blob-teal"></span>
    <span class="blob blob-pink"></span>
    <span class="blob blob-gold"></span>
    <div class="grain"></div>
  </div>

  <div class="app">

    <header class="topbar">
      <div class="topbar__brand">
        <button class="topbar__burger" id="burger-btn" aria-label="Открыть меню курсов">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="brand-mark__glyph">Ix</span>
        <span class="brand-mark__word">Index</span>
      </div>
      <div class="topbar__right">
        <div class="streak-pill" title="Пройдено уроков подряд"><svg class="pill-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 3-2 4-2 7a4 4 0 0 0 8 0c0-1-.4-2-1-3 2 1 3 3 3 6a6 6 0 0 1-12 0c0-4 2-6 4-10z"/></svg> <strong id="streak-num">0</strong></div>
        <div class="streak-pill" title="Звёзды за правильные ответы"><svg class="pill-ic" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2l3.1 6.6 7.2.9-5.3 4.9 1.5 7.1L12 17.9 5.5 21.5l1.5-7.1-5.3-4.9 7.2-.9L12 2z"/></svg> <strong id="stars-num">0</strong></div>
        <button class="topbar__profile-btn" id="profile-nav-btn" title="Профиль" aria-label="Открыть профиль">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.6-4 5-6 8-6s6.4 2 8 6"/></svg>
        </button>
        <div class="user-menu">
          <button class="user-chip" id="user-chip">
            <span class="user-chip__avatar" id="user-initial">У</span>
            <span id="user-name">Ученик</span>
          </button>
          <div class="user-dropdown" id="user-dropdown">
            <div class="user-dropdown__email" id="user-email-dd"></div>
            <button id="profile-link-btn">Профиль и настройки</button>
            <button id="logout-btn" class="danger">Выйти из аккаунта</button>
          </div>
        </div>
      </div>
    </header>

    <div class="sidebar__overlay" id="sidebar-overlay"></div>
    <aside class="sidebar" id="sidebar">
      <nav id="sidebar-nav"></nav>
    </aside>

    <main class="main">
      <div id="view-root"></div>
    </main>

  </div>

  <script>window.__API_BASE__ = "https://econ-platform-xeav.onrender.com/api";</script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
